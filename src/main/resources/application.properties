spring.application.name=codecobain-backend

server.port=8080

# ============== MinIO ============
minio.endpoint=${MINIO_ENDPOINT:http://minio.storage.svc.cluster.local:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin123}
minio.bucket=${MINIO_BUCKET:wafer-image-bucket}

# =============== database ==================
spring.datasource.url=${DB_URL:jdbc:mysql://mysql.storage.svc.cluster.local:3306/appdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:apppass123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# 스키마는 Flyway가 관리한다. ddl-auto로 이미 테이블이 만들어진 DB는 version 1로 baseline하고 V2부터 적용한다
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ========= AI server ============
ai.server.url=${AI_SERVER_URL:http://ai-serving-service.ai-serving.svc.cluster.local:8000}
ai.endpoint.predict=/predict
ai.client.connect-timeout=2s
ai.client.read-timeout=10s
ai.model-version=${AI_MODEL_VERSION:wafer-cnn-v1}

# 이 값보다 신뢰도가 낮으면 NEED_REVIEW로 분류한다
inspection.review-confidence-threshold=0.8

# 이 시간 동안 상태 변화가 없는 진행 중 검사를 FAILED로 돌린다. AI 호출 제한(10초)보다 충분히 길어야 한다
inspection.stuck.timeout=5m
inspection.stuck.scan-interval=PT1M

# DB에서 읽는 업무 지표(mes_*) 갱신 주기
mes.metrics.refresh-interval=PT1M

# 판정 웨이퍼가 min-judged-wafers장 이상이고, 기준 결함률에서 이만큼의 결함이 나올 확률(이항검정)이 significance 미만이면 자동 Hold한다
lot.hold.min-judged-wafers=5
lot.hold.baseline-defect-rate=0.08
lot.hold.significance=0.001

# 같은 공정의 다른 설비와 비교해 아래 조건을 모두 넘으면 의심 설비로 표시한다
spc.commonality.min-wafers=30
spc.commonality.min-z-score=3.0
spc.commonality.min-lift=2.0

# SPC는 일 단위 지표라 1분 지연을 허용하고 결과를 캐시한다. 같은 조건의 동시 요청은 한 번만 계산한다
spring.cache.cache-names=spcPChart,spcCommonality
spring.cache.caffeine.spec=expireAfterWrite=60s,maximumSize=500


# ========= Actuator ============
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
# SLO(p95 < 1초) 계산용 지연 히스토그램 버킷. 전체 percentiles-histogram 대신 필요한 버킷만 낸다
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2s,5s

# 로그에 trace_id를 남겨 Grafana(Loki)에서 Tempo trace로 이동한다 (OTel Java agent가 MDC에 채움, agent가 없으면 빈 값)
logging.pattern.level=%5p [trace_id=%X{trace_id:-} lot_id=%X{lot_id:-} inspection_id=%X{inspection_id:-}]


# ========= Resilience4j Circuit Breaker ============
resilience4j.circuitbreaker.instances.aiServing.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.aiServing.sliding-window-size=10
resilience4j.circuitbreaker.instances.aiServing.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.aiServing.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.aiServing.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.aiServing.automatic-transition-from-open-to-half-open-enabled=true
# 규격에 맞지 않는 입력(400)은 AI 서버 장애가 아니므로 실패율에 넣지 않는다
resilience4j.circuitbreaker.instances.aiServing.ignore-exceptions=org.springframework.web.client.HttpClientErrorException.BadRequest