plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.minjikim'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// Boot 3.3 BOM의 Testcontainers는 Docker 29(최소 API 1.40)에 접속하지 못해 통합 테스트가 건너뛰어진다
ext['testcontainers.version'] = '1.21.4'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-json'

    implementation 'org.json:json:20231013'

    // MinIO - AWS SDK v1 (S3 호환)
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.603'


    implementation 'io.micrometer:micrometer-registry-prometheus'

    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j:3.1.2'
    implementation 'io.github.resilience4j:resilience4j-micrometer:2.2.0'

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'

    // DB 마이그레이션
    // 활성 Span에서 trace_id를 읽는다. agent가 없으면 no-op이다
    implementation 'io.opentelemetry:opentelemetry-api'

    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

processResources {
    from('src/main/resources')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
// Docker 빌드용: src 없이 의존성 jar를 미리 받아 둔다 (Dockerfile의 의존성 레이어 → kaniko 캐시)
// `gradlew dependencies`는 메타데이터만 받으므로 jar까지 내려받도록 클래스패스를 직접 resolve한다
tasks.register('resolveDependencies') {
    def classpaths = ['compileClasspath', 'runtimeClasspath', 'annotationProcessor'].collect { configurations.named(it) }
    doLast {
        classpaths.each { it.get().files }
    }
}
